<!doctype html>
<html lang="en" data-coreui-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub demo — Verxee UI</title>
  <link rel="stylesheet" href="../vendor/coreui/coreui.min.css">
  <link rel="stylesheet" href="../vendor/tabler-icons/css/tabler-icons.min.css">
  <link rel="stylesheet" href="../dist/verxee-ui.min.css">
  <style>
    body { margin: 0; display: grid; grid-template-rows: 48px 1fr 140px; height: 100vh; background: var(--admin-bg); }
    .hubbar { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--admin-border); background: var(--admin-surface); }
    iframe { width: 100%; height: 100%; border: 0; }
    #log { margin: 0; padding: 8px 16px; overflow: auto; font: 12px/1.5 ui-monospace, monospace; border-top: 1px solid var(--admin-border); background: var(--admin-surface); }
  </style>
</head>
<body>
<!-- What a hub does: frames the app, says hello (theme), listens to the app, and owns sign-in at the top level. -->
<div class="hubbar">
  <strong><i class="ti ti-circles-relation"></i> Hub demo</strong>
  <span class="muted fs-sm" id="title">—</span>
  <span class="status status--info" id="badge" hidden></span>
  <span class="ms-auto"></span>
  <button class="btn btn-secondary btn-sm" id="theme">Dark</button>
  <button class="btn btn-outline-danger btn-sm" id="out">Sign out everywhere</button>
</div>
<iframe id="app" title="App"></iframe>
<pre id="log"></pre>
<script>
  // Demo: the app runs on another origin (?app=…) to prove the origin checks. Default = same server.
  var appUrl = new URLSearchParams(location.search).get('app') || 'hub-app.html';
  var frame = document.getElementById('app'), appOrigin = new URL(appUrl, location.href).origin;
  frame.src = appUrl;
  function log(s) { var l = document.getElementById('log'); l.textContent = s + '\n' + l.textContent; }
  function send(m) { m.vx = 1; frame.contentWindow.postMessage(m, appOrigin); log('hub → app  ' + JSON.stringify(m)); }
  frame.addEventListener('load', function () { send({ type: 'hello', theme: document.documentElement.getAttribute('data-coreui-theme') }); });
  window.addEventListener('message', function (e) {
    if (e.origin !== appOrigin || e.source !== frame.contentWindow || !e.data || e.data.vx !== 1) return;
    log('app → hub  ' + JSON.stringify(e.data));
    if (e.data.type === 'title' || e.data.type === 'ready') document.getElementById('title').textContent = e.data.title;
    if (e.data.type === 'badge') { var b = document.getElementById('badge'); b.hidden = !e.data.count; b.textContent = e.data.count; }
    if (e.data.type === 'login-required') log('   (a real hub now shows ITS sign-in page at the top level, then reloads the frame)');
  });
  document.getElementById('theme').onclick = function () {
    var t = document.documentElement.getAttribute('data-coreui-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-coreui-theme', t); send({ type: 'theme', theme: t });
  };
  document.getElementById('out').onclick = function () { send({ type: 'logout' }); };
</script>
</body>
</html>
