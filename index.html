<!doctype html>
<html lang="en" data-coreui-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verxee UI — demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@coreui/coreui@5.3.1/dist/css/coreui.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <script>
    // Apply the saved theme before first paint (no flash).
    try { var t = localStorage.getItem('verxee-ui-theme'); if (t) document.documentElement.setAttribute('data-coreui-theme', t); } catch (e) {}
  </script>
</head>
<body>
<nav class="admin-topbar" aria-label="Top bar">
  <button class="btn btn-ghost-secondary btn-sm d-lg-none me-2" type="button" data-sidebar-toggle aria-label="Menu"><i class="ti ti-menu-2"></i></button>
  <div class="brand me-3"><a href="#/dashboard"><span class="brand-logo"><i class="ti ti-layout-dashboard"></i></span><span class="hide-xs">Verxee UI</span></a></div>
  <div class="d-flex align-items-center gap-2 ms-auto">
    <div class="dropdown">
      <button class="btn btn-ghost-secondary btn-sm icon-btn" data-coreui-toggle="dropdown" aria-label="Notifications"><i class="ti ti-bell fs-5"></i><span class="dot" id="notifDot" hidden></span></button>
      <div class="dropdown-menu dropdown-menu-end notif-menu">
        <div class="d-flex align-items-center px-2 py-1"><strong>Notifications</strong>
          <a class="ms-auto fs-sm" href="#" id="notifReadAll">Mark all read</a></div>
        <div id="notifList"></div>
      </div>
    </div>
    <button class="btn btn-ghost-secondary btn-sm" type="button" data-theme-toggle aria-label="Toggle theme"><i class="ti ti-moon"></i></button>
    <div class="dropdown">
      <button class="btn btn-ghost-secondary btn-sm d-flex align-items-center gap-2" data-coreui-toggle="dropdown" aria-label="Account"><span class="avatar">JD</span><span class="hide-xs">Jane Doe</span></button>
      <div class="dropdown-menu dropdown-menu-end">
        <a class="dropdown-item" href="#/settings"><i class="ti ti-user"></i> Profile</a>
        <a class="dropdown-item" href="#/settings"><i class="ti ti-settings"></i> Settings</a>
      </div>
    </div>
  </div>
</nav>

<div class="sidebar sidebar-fixed" id="sidebar">
  <ul class="sidebar-nav" data-coreui="navigation">
    <li class="nav-item"><a class="nav-link" data-route="dashboard" href="#/dashboard"><i class="nav-icon ti ti-layout-dashboard"></i> Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" data-route="orders" href="#/orders"><i class="nav-icon ti ti-shopping-cart"></i> Orders</a></li>
    <li class="nav-item"><a class="nav-link" data-route="customers" href="#/customers"><i class="nav-icon ti ti-users"></i> Customers</a></li>
    <li class="nav-title">Admin</li>
    <li class="nav-item"><a class="nav-link" data-route="permissions" href="#/permissions"><i class="nav-icon ti ti-shield-lock"></i> Permissions</a></li>
    <li class="nav-item"><a class="nav-link" data-route="audit" href="#/audit"><i class="nav-icon ti ti-history"></i> Audit log</a></li>
  </ul>
  <div class="sidebar-footer border-top"><a class="nav-link fs-sm" data-route="settings" href="#/settings"><i class="ti ti-settings"></i> Settings</a></div>
</div>
<div class="sidebar-backdrop" data-sidebar-toggle></div>

<div class="admin-wrapper">
  <main class="admin-content" id="main"></main>
</div>
<div class="toast-stack" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@coreui/coreui@5.3.1/dist/js/coreui.bundle.min.js"></script>
<script src="js/verxee-ui.js"></script>
<script src="js/demo.js"></script>
</body>
</html>
