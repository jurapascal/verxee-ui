<!-- title: Customizer | group: Customize | order: 6 -->
<h1>Customizer</h1>
<p class="lead">Change the look of this very page live, then copy the config.</p>

<div class="card mb-4"><div class="card-body">
  <div class="form-row-inline">
    <div><label class="form-label" for="cAccent">Accent</label><input id="cAccent" type="color" class="form-control" value="#2563eb" style="padding:3px"></div>
    <div><label class="form-label" for="cRadius">Radius</label><select id="cRadius" class="form-select"><option value="sharp">sharp</option><option value="default" selected>default</option><option value="round">round</option></select></div>
    <div><label class="form-label" for="cDensity">Density</label><select id="cDensity" class="form-select"><option>compact</option><option selected>default</option><option>comfortable</option></select></div>
    <div><label class="form-label" for="cPos">Toast position</label><select id="cPos" class="form-select"><option>bottom-right</option><option>bottom-center</option><option>bottom-left</option><option>top-right</option><option>top-center</option><option>top-left</option></select></div>
  </div>
</div></div>

<h2>Preview</h2>
<div class="example"><div class="example-preview">
  <button class="btn btn-primary">Primary</button><button class="btn btn-secondary">Secondary</button>
  <button class="btn btn-outline-danger">Delete</button><button class="btn btn-primary btn-sm">Small</button>
  <input class="form-control w-input-md" placeholder="Input">
  <span class="status status--success">Paid</span>
  <button class="btn btn-secondary" id="pToast">Toast</button>
  <button class="btn btn-secondary" id="pConfirm">Confirm</button>
  <button class="btn btn-secondary" id="pModal">Modal</button>
  <button class="btn btn-secondary" data-vx-popover="Same radius, same accent." data-vx-popover-title="Popover">Popover</button>
</div></div>

<h2>Your config</h2>
<pre><code id="cOut"></code></pre>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function apply() {
    var theme = { accent: $('cAccent').value, radius: $('cRadius').value, density: $('cDensity').value };
    VerxeeUI.configure({ theme: theme, toast: { position: $('cPos').value } });
    $('cOut').textContent = 'VerxeeUI.configure({\n  theme: { accent: \'' + theme.accent + '\', radius: \'' + theme.radius + '\', density: \'' + theme.density + '\' },\n  toast: { position: \'' + $('cPos').value + '\' }\n});';
  }
  ['cAccent', 'cRadius', 'cDensity', 'cPos'].forEach(function (id) { $(id).addEventListener('input', apply); });
  $('pToast').onclick = function () { VerxeeUI.toast('Settings saved', { type: 'success' }); };
  $('pConfirm').onclick = function () { VerxeeUI.confirm({ title: 'Delete order?', description: 'This cannot be undone.', variant: 'danger', confirmText: 'Delete' }); };
  $('pModal').onclick = function () { VerxeeUI.modal({ title: 'New customer', fields: [{ name: 'name', label: 'Name' }, { name: 'email', label: 'E-mail', type: 'email' }] }); };
  window.addEventListener('DOMContentLoaded', apply);
})();
</script>
