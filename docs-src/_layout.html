<!doctype html>
<html lang="en" data-coreui-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — Verxee UI</title>
  <link rel="preload" href="../fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../vendor/coreui/coreui.min.css">
  <link rel="stylesheet" href="../vendor/tabler-icons/css/tabler-icons.min.css">
  <link rel="stylesheet" href="../dist/verxee-ui.min.css">
  <link rel="stylesheet" href="docs.css">
  <script>try{var t=localStorage.getItem('verxee-ui-theme');if(t)document.documentElement.setAttribute('data-coreui-theme',t)}catch(e){}</script>
  <script src="../dist/verxee-ui.min.js"></script>
</head>
<body>
<a class="skip-link visually-hidden-focusable" href="#main">Skip to content</a>
<nav class="admin-topbar" aria-label="Top bar">
  <button class="btn btn-ghost-secondary btn-sm d-lg-none me-2" type="button" data-sidebar-toggle aria-label="Menu"><i class="ti ti-menu-2"></i></button>
  <div class="brand me-3"><a href="index.html"><span class="brand-logo"><i class="ti ti-layout-dashboard"></i></span><span>Verxee UI</span><span class="muted fs-sm hide-xs">v{{version}}</span></a></div>
  <div class="d-flex align-items-center gap-2 ms-auto">
    <a class="btn btn-ghost-secondary btn-sm" href="../index.html"><i class="ti ti-player-play"></i><span class="hide-xs"> Demo</span></a>
    <a class="btn btn-ghost-secondary btn-sm" href="https://github.com/jurapascal/verxee-ui"><i class="ti ti-brand-github"></i><span class="hide-xs"> GitHub</span></a>
    <button class="btn btn-ghost-secondary btn-sm" type="button" data-theme-toggle aria-label="Toggle theme"><i class="ti ti-moon"></i></button>
  </div>
</nav>
<div class="sidebar sidebar-fixed" id="sidebar"><ul class="sidebar-nav" data-coreui="navigation">{{nav}}</ul></div>
<div class="sidebar-backdrop" data-sidebar-toggle></div>
<div class="admin-wrapper"><main class="admin-content docs" id="main">
{{body}}
</main></div>
<script defer src="../vendor/coreui/coreui.bundle.min.js"></script>
</body>
</html>
